server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = / {
        try_files /index.html =404;
    }

    # Keep old bookmarks working while making the extensionless URL canonical.
    location = /index.html {
        return 301 /;
    }

    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    # Resolve /about to about.html (and likewise for the other static pages).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
